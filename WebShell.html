 if(gain)p('实际差值 ',f(point));else p('实际胜率 ',f(point),num(a.count)?'（'+games(a.count)+' 场）':'');

const semanticColors={physicalDamage:'#ff8c34',attackDamage:'#ff8c34',magicDamage:'#6fa8ff',abilityPower:'#6fa8ff',trueDamage:'#ffffff',heal:'#5fd35f',health:'#5fd35f',lifeSteal:'#5fd35f',omnivamp:'#5fd35f',shield:'#8fd8e8',armor:'#f2c46d',magicResist:'#b88cff',movementSpeed:'#f3e9a4',attackSpeed:'#f7d44a',criticalStrike:'#ff6a4d',abilityHaste:'#e8e0c8',mana:'#3fb6ff',gold:'#ffd23f',armorPenetration:'#ff8c34',magicPenetration:'#6fa8ff',onHit:'#f0a060',passive:'#f0c75e',active:'#f0c75e',keywordMajor:'#f0c75e',spellName:'#f0c75e',spellPassive:'#f0c75e',unique:'#f0c75e',keyword:'#e9d7a6',status:'#e9d7a6',recast:'#e9d7a6',flavorText:'#9fb3b8',rarityPrismatic:'#e87cff',rarityLegendary:'#f0a030',ornnBonus:'#f0c75e'};
const semanticBold=new Set(['trueDamage','passive','active','keywordMajor','spellName','spellPassive','unique','stat','totalValue','level']);
function richText(node,text){String(text||'').split('\n').forEach((line,i)=>{if(i)node.append(el('br'));node.append(el('span',line));});}
function statBlock(block){const spans=block.spans||[];if(block.role!=='paragraph'||!spans.some(s=>s.icon)||!spans.some(s=>s.s==='stat')||!spans.every(s=>s.icon||(s.t!=null&&(!s.s||s.s==='stat'))))return false;const text=spans.filter(s=>s.t!=null).map(s=>s.t).join('');return /^[\s\d.%％+＋−/-]*[^\s\d.%％,，。;；:：()（）]{0,8}$/.test(text);}
function renderRich(tip,rich,icon){tip.replaceChildren();tip.append(iconLabel(el('div',rich.title,'tip-title'),rich.title,icon));(rich.meta||[]).forEach(m=>tip.append(el('div',m,'tip-meta')));let stats=null;(rich.blocks||[]).forEach(block=>{const compact=statBlock(block);if(!compact)stats=null;if(compact&&!stats){stats=el('div',null,'tip-stats');tip.append(stats);}const row=el(compact?'span':'div',null,'tip-'+block.role);if(block.role==='listItem')row.append(el('span','• '));const spans=block.spans||[];spans.forEach((s,index)=>{if(s.icon){const uri=state?.icons?.[s.icon];if(uri){const img=el('img',null,'tip-icon');img.src=uri;img.alt=s.label||'';row.append(img);}else if(s.label==='goldCoins'&&/^\d+(?:\.\d+)?$/.test(spans[index+1]?.t||'')){richText(row,spans[index+1].t+(s.fallback||''));}else richText(row,s.fallback||'');}else {if(index&&spans[index-1].label==='goldCoins'&&!state?.icons?.[spans[index-1].icon]&&/^\d+(?:\.\d+)?$/.test(s.t||''))return;const n=el('span');n.style.color=semanticColors[s.s]||'';if(s.b||semanticBold.has(s.s))n.style.fontWeight='bold';if(s.i||s.s==='flavorText')n.style.fontStyle='italic';richText(n,s.t);row.append(n);}});(compact?stats:tip).append(row);});}
let tooltipTarget=null;
function hideTooltip(){tooltipTarget=null;$('tooltip').hidden=true;}
function tooltipFor(target){const tip=$('tooltip');if(!target||!target.dataset.tip){hideTooltip();return;}if(target===tooltipTarget&&!tip.hidden)return;tooltipTarget=target;if(target.metricInfo)renderAxisTip(tip,target.metricInfo);else{tip.className=target.rich?'tooltip rich':'tooltip';if(target.rich)renderRich(tip,target.rich,target.icon);else {tip.replaceChildren();const lines=target.dataset.tip.split('\n');tip.append(iconLabel(el('div',lines.shift(),'tip-title'),target.dataset.tip.split('\n')[0],target.icon),el('div',lines.join('\n')));}}tip.hidden=false;const r=target.getBoundingClientRect();let left=Math.min(r.left,innerWidth-tip.offsetWidth-12),top=r.bottom+10;if(top+tip.offsetHeight>innerHeight-12)top=Math.max(12,r.top-tip.offsetHeight-10);tip.style.left=Math.max(12,left)+'px';tip.style.top=top+'px';}
function hoverTarget(target){if(typeof target?.className==='string'&&target.className.split(' ').includes('augment-stage'))return null;return target?.closest?.('[data-tip]')||null;}
document.addEventListener('mouseover',e=>tooltipFor(hoverTarget(e.target)),true);document.addEventListener('mouseenter',e=>tooltipFor(hoverTarget(e.target)),true);document.addEventListener('mouseout',e=>{const next=hoverTarget(e.relatedTarget);if(next!==tooltipTarget)tooltipFor(next);},true);document.addEventListener('focusin',e=>tooltipFor(hoverTarget(e.target)));document.addEventListener('scroll',hideTooltip,true);
document.addEventListener('keydown',e=>{if(e.key==='Tab')e.preventDefault();},true);document.addEventListener('keydown',e=>{if(e.key==='Escape'){['tooltip','settings','suggestions'].forEach(id=>$(id).hidden=true);toggleThemeMenu(false);}});document.addEventListener('click',e=>{['settings'].forEach(id=>{if(!e.target.closest('#'+id)&&!e.target.closest('#settingsButton'))$(id).hidden=true;});if(!e.target.closest('.searchfield'))$('suggestions').hidden=true;if(!e.target.closest('.themepick')&&!$('themeMenu').hidden)toggleThemeMenu(false);});
$('heroSearch').addEventListener('input',()=>{clearTimeout(searchTimer);const q=$('heroSearch').value.trim();if(!q){$('suggestions').hidden=true;return;}searchTimer=setTimeout(()=>send('search',q),100);});$('heroSearch').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){$('suggestions').querySelector('button')?.focus();e.preventDefault();}if(e.key==='Enter'){const list=$('suggestions').querySelectorAll('button');if(list.length===1)list[0].click();}});$('suggestions').addEventListener('keydown',e=>{const bs=[...$('suggestions').querySelectorAll('button')],i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'){bs[Math.min(i+1,bs.length-1)]?.focus();e.preventDefault();}if(e.key==='ArrowUp'){if(i<=0)$('heroSearch').focus();else bs[i-1].focus();e.preventDefault();}});
$('augmentSearch').addEventListener('input',()=>{clearTimeout(augTimer);augTimer=setTimeout(()=>send('augmentSearch',$('augmentSearch').value),130);});
window.chrome.webview.addEventListener('message',e=>{const m=e.data;if(m.type==='theme'){applyTheme(m.palette);currentTheme=m.theme;renderThemeMenu();}else if(m.type==='images'){Object.entries(m.images||{}).forEach(([path,uri])=>{if(typeof uri==='string'&&/^data:image\/(webp|png);base64,/.test(uri))images[path]=uri;});}else if(m.type==='state'){render(m);if(!rendered){rendered=true;requestAnimationFrame(()=>send('rendered'));}}else if(m.type==='search'){if(m.query!==$('heroSearch').value.trim())return;const list=$('suggestions');list.replaceChildren();m.heroes.forEach(h=>{const b=heroLabel(el('button'),h.title||'',h.name,h.icon);b.onclick=()=>openHero(h.id);list.append(b);});if(!m.heroes.length)list.append(el('div','未找到匹配英雄','muted'));list.hidden=false;}else if(m.type==='shopStatus')renderShop(m);else if(m.type==='updateStatus')renderUpdate(m);else if(m.type==='error')showError(m.message);});send('ready');
