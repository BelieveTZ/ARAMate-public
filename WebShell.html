<div class="shell">
 <header class="topbar"><nav class="boards" aria-label="榜单"><button class="board" id="hometab" aria-current="page" onclick="openBoard('heroes')">英雄胜率总榜</button><button class="board" id="gaintab" aria-current="false" onclick="openBoard('gain')">海克斯提升榜</button></nav><label class="switch" title="打开后显示按场次修正过的统计学胜率与提升，以及它们的可能范围；关掉只看实际数据"><input type="checkbox" id="advanced" onchange="send('advanced',this.checked?'1':'0')"><span class="track"></span>高级模式</label><div class="field searchfield"><span class="searchicon">⌕</span><input id="heroSearch" aria-label="搜索英雄" placeholder="英雄名称、称号或外号" autocomplete="off" aria-controls="suggestions"><div class="suggestions" id="suggestions" hidden></div></div></header><p class="data-note" id="dataSource"></p><p class="data-note" id="dataSource"></p>

 <main class="panel content" id="content"><div class="navrow" id="navrow" hidden><button class="backlink" id="overviewBack" onclick="send('section','概览')" hidden>‹ 概览</button><h3 class="section-title" id="sectionTitle" hidden></h3><nav class="tabs" id="tabs" hidden></nav><div class="subbar" id="subbar" hidden><nav class="filters" id="filters"></nav><div class="subfields" id="augfields" hidden><select aria-label="海克斯品质" id="rarity" onchange="send('rarity',this.value)"><option value="0">全部品质</option><option value="1">彩色</option><option value="2">金色</option><option value="3">银色</option></select><input aria-label="搜索海克斯" id="augmentSearch" placeholder="搜索海克斯"></div><div class="subfields" id="flowfields" hidden><label for="flow" class="muted">适用方案</label><div id="flowpicker"><button type="button" id="flow" role="combobox" aria-haspopup="listbox" aria-controls="flowlist" aria-expanded="false" aria-label="适用方案"></button><div id="flowlist" class="plan-list" role="listbox" aria-label="适用方案" hidden></div></div></div></div></div><div class="overview" id="overview" hidden></div><div class="tablewrap" id="table"><div class="loading">正在读取数据…</div></div></main>
 <footer class="footer"><span id="version"></span><span id="gameversion"></span><span id="date"></span><div class="update-control"><button id="shopStatus" role="status" hidden></button><button id="check" onclick="checkUpdate()">检查数据更新</button><span id="updateStatus" role="status" hidden></span><div id="updateProgress" class="update-progress" aria-hidden="true"><div id="updateProgressFill" class="update-progress-fill"></div></div></div><button id="settingsButton" onclick="openSettings()">设置</button><button id="historyButton" aria-haspopup="dialog" aria-controls="historyPanel" aria-expanded="false" onclick="toggleVersionHistory()">版本历史</button></footer>
</div>

<section class="floating" id="settings" role="dialog" aria-labelledby="settingsTitle" hidden><header><h2 id="settingsTitle">设置</h2><button class="close" aria-label="关闭设置" onclick="closePanel('settings')">×</button></header><div class="field"><label id="themeLabel">主题</label><div id="themeOptions" class="theme-options" role="radiogroup" aria-labelledby="themeLabel"></div></div><div class="field"><label for="closeMode">关闭窗口时</label><select id="closeMode" onchange="send('closeMode',this.value)"><option value="0">退出程序</option><option value="1">最小化至托盘</option></select></div><div class="field"><label for="autoMinimize">进入对局时自动最小化主窗口</label><select id="autoMinimize" onchange="send('autoMinimize',this.value)"><option value="1">开启</option><option value="0">关闭</option></select></div><div class="field"><label for="skillMode">局内技能加点</label><select id="skillMode" onchange="send('skillMode',this.value)"><option value="0">不显示</option><option value="1">只显示最佳加点顺序</option><option value="2">显示前三名加点顺序</option></select></div></section>
